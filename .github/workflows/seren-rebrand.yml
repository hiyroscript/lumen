name: Seren rebrand

on:
  push:
    branches:
      - rebrand-seren

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old brand everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = (
              ('Red<span class="t2">line</span>', 'Se<span class="t2">ren</span>'),
              ('REDLINE', 'SEREN'),
              ('Redline', 'Seren'),
              ('redline', 'seren'),
          )

          root = Path('.')
          workflow = Path('.github/workflows/seren-rebrand.yml')
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(path)
          PY

      - name: Validate project
        run: node tools/check.mjs

      - name: Remove one-shot workflow and verify old brand is gone
        run: |
          rm .github/workflows/seren-rebrand.yml
          if grep -RniI --exclude-dir=.git -E 'redline' .; then
            echo 'Old Redline branding still exists.' >&2
            exit 1
          fi

      - name: Commit rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fully rebrand Redline to Seren"
          git push origin HEAD:rebrand-seren

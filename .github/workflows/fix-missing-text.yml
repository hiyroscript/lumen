name: Fix missing text
on:
  push:
    branches: [fix-missing-text]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-missing-text
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          core = Path('js/core.js')
          s = core.read_text()
          old = '''const store = {
            get(k){ try{ const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : null) : v; }catch(e){ return k in mem ? mem[k] : null; } },
            set(k,v){ mem[k] = String(v); try{ localStorage.setItem(k, String(v)); }catch(e){} }
          };
'''
          new = old + '''
          /* Carry existing players' preferences and records across the rename. */
          ["lang", "sound", "best"].forEach(function(k){
            const next = "seren." + k;
            if(store.get(next) !== null) return;
            const prior = store.get("redline." + k);
            if(prior !== null) store.set(next, prior);
          });
'''
          if old not in s:
            raise SystemExit('core.js storage block not found')
          core.write_text(s.replace(old, new, 1))

          i18n = Path('js/i18n.js')
          s = i18n.read_text()
          s = s.replace('let lang = store.get("seren.lang") || null;', 'let lang = store.get("seren.lang") || null;\nif(lang !== "en" && lang !== "fr") lang = null;', 1)
          s = s.replace('if(s) el.textContent = s[L];', 'if(s) el.textContent = s[L] || s.en || el.getAttribute("data-i18n");', 1)
          s = s.replace('const tn = $("#trackName"); if(tn) tn.textContent = STR[curTrackKey][L];', 'const tn = $("#trackName"); if(tn) tn.textContent = STR[curTrackKey][L] || STR[curTrackKey].en || curTrackKey;', 1)
          i18n.write_text(s)
      - name: Validate
        run: |
          node tools/check.mjs
          grep -q 'redline\.lang' js/core.js
          grep -q 's\[L\] || s\.en' js/i18n.js
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-missing-text.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix missing localized text and migrate saved settings'
          git push origin HEAD:fix-missing-text
